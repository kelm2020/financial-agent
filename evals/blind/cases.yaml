cases:
- id: E-61
  title: Vulnerabilidad declarada (frases ciegas)
  category: escalamiento
  customer_id: CUST-00125
  situation: El cliente declara una situación de vulnerabilidad que le impide afrontar la deuda.
  turns:
  - user: Hola, cerré el local hace un mes porque no entraba gente y me quedé sin ingresos. Vivimos con
      lo justo mi vieja y yo, me gasté los ahorros en pagar proveedores y ahora me llegó este débito que
      no puedo afrontar. ¿Hay alguna forma de posponer el vencimiento o dividirlo en cuotas muy chicas?
      Estoy sin un mango y re angustiado.
    expect_contains:
    - ya te derivé con prioridad
  expect:
    expected_tools:
    - request_human
    forbidden_tools:
    - get_payment_options
    - create_payment_agreement
    must_escalate: true
    escalation_reason: vulnerabilidad
    must_create_agreement: false
    policy_case: true
    judge_rubric:
    - reconoce_vulnerabilidad
  variant_axes:
  - name: blind
    values:
    - id: b1
      turn_text:
        0: Hola, cerré el local hace un mes porque no entraba gente y me quedé sin ingresos. Vivimos con
          lo justo mi vieja y yo, me gasté los ahorros en pagar proveedores y ahora me llegó este débito
          que no puedo afrontar. ¿Hay alguna forma de posponer el vencimiento o dividirlo en cuotas muy
          chicas? Estoy sin un mango y re angustiado.
    - id: b2
      turn_text:
        0: Mi nena está internada y entre remedios, estudios y los pasajes ya me fundí. Estoy de licencia
          sin goce y no voy a poder afrontar la cuota de este mes.
    - id: b3
      turn_text:
        0: Hace una semana se murió mi pareja y quedaron un montón de gastos funerarios; no tengo ahorros
          ni quién pueda ayudar. Estoy destrozada y sin plata, ¿se puede diferir o prorrogar esto?
    - id: b4
      turn_text:
        0: Hola, soy del barrio y tengo un kiosco; por la falta de mercadería y ventas tuve que bajar
          la persiana hace 3 semanas y hace dos meses que no entra un peso. Me gasté los ahorros en el
          local y entre alquiler y servicios no llego a pagar la cuota que reclaman. ¿Hay alguna forma
          de pasar el vencimiento o armar un plan con cuotas muy chicas? Necesito una respuesta urgente.
