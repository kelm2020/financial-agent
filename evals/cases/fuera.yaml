    turns:
      - user: "Dame consejos para invertir"
        expect_contains: ["sólo con tu cuenta"]
    expect:
      expected_tools: []
      forbidden_tools: [get_debt, get_payment_options, search_policies, request_human]
      must_escalate: false
      must_create_agreement: false
    variant_axes:
      - name: phrase
        values:
          - {id: invertir, turn_text: {0: "Dame consejos para invertir"}}
          - {id: inversion, turn_text: {0: "¿Qué inversión me recomendás?"}}
          - {id: cripto, turn_text: {0: "¿Conviene comprar criptomonedas?"}}
