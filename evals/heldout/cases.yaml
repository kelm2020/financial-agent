              response_contains: ["La más cercana es 3 cuotas de $61.500"]
          - id: cinco
            turn_text: {0: "Quisiera hacerlo en 5 cuotas"}
            expect:
              response_contains: ["La más cercana es anticipo de $18.450 y 6 cuotas"]
