  - id: N-51
    title: Cantidad de cuotas sin opción exacta
    category: negociacion
    customer_id: CUST-00125
    situation: El cliente pide una cantidad de cuotas que no coincide con ninguna alternativa habilitada.
    turns:
      - user: "¿Puedo pagar en 4 cuotas?"
    expect:
      expected_tools: [get_customer, get_debt, get_payment_options]
      forbidden_tools: [create_payment_agreement, request_human]
      must_escalate: false
      must_create_agreement: false
      policy_case: true
    variant_axes:
