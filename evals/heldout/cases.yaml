    variant_axes:
      - name: phrase
        values:
          - {id: no_es_mia, turn_text: {0: "Esa deuda no es mía"}}
          - {id: nunca, turn_text: {0: "Nunca saqué esa tarjeta"}}
          - {id: de_mas, turn_text: {0: "Me están cobrando de más"}}

  - id: E-54
