# Regresión de preguntas de política escrita por el equipo. NO es held-out ni ciega: después de
# congelarla, términos de sus frases entraron a app/graph/ontology.py y app/graph/routing.py, así
# que por la regla anticontaminación (§11.3) se reporta como regresión. La generalización del
# fraseo se mide con frases ciegas (scripts/generate_blind_phrasings.py).
effective_on: 2026-09-12
cases:
  - {id: H01, query: "Che, cancelando de una, ¿me reducen algo de los intereses?", source: rag, answerable: true, sections: [POL-NEG-003], required: "Sólo intereses, sólo pago único; depende del segmento, no una oferta personal."}
