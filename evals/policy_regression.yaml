  - {id: H03, query: "¿Aceptan que vaya amortizando un pedacito sin convenio?", source: rag, answerable: true, sections: [FAQ-001, POL-NEG-006], required: "Mínimo 10%; no suspende cobranza ni reemplaza acuerdo ni da quita."}
