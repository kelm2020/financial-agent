name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: collections
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d collections"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collections
      # The Postgres store has no coverage exclusion: the integration suite must run here.
      RUN_POSTGRES_TESTS: "1"
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m scripts.initialize_database
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run python -m evals.run --suite level-a --k 1 --no-report
      - run: uv run python -m evals.run --suite level-a --dataset heldout --k 1 --no-report
      - run: uv run python -m evals.run --suite level-a --dataset blind --k 1 --no-report
      - run: >-
          uv run python -m scripts.calibrate_judge
          --dataset evals/judge_calibration.yaml
          --results evals/judge_results.json
          --split test

  live-evaluation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: gpt-5-nano
      OPENAI_SIMULATOR_MODEL: gpt-4.1-mini-2025-04-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Require live-evaluation secret
        run: test -n "$OPENAI_API_KEY"
      - name: Canonical pass^5
        run: >-
          uv run python -m evals.run --suite live --dataset canonical --k 5
          --input-cost-per-million 0.05 --cached-cost-per-million 0.005
          --output-cost-per-million 0.40
      - name: Held-out pass^5
        run: >-
          uv run python -m evals.run --suite live --dataset heldout --k 5
          --input-cost-per-million 0.05 --cached-cost-per-million 0.005
          --output-cost-per-million 0.40
      - name: Blind pass^5
        run: >-
          uv run python -m evals.run --suite live --dataset blind --k 5
          --input-cost-per-million 0.05 --cached-cost-per-million 0.005
          --output-cost-per-million 0.40
      - name: Simulated multi-turn users
        run: uv run python -m scripts.simulate_personas
