[project]
name = "financial-agent"
version = "0.1.0"
description = "Agente conversacional de cobranzas con control de flujo determinista"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "langgraph-checkpoint-postgres==3.1.2",
  "pgvector>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "pyyaml>=6.0,<7",
  "snowballstemmer>=3.1.1",
  "sqlalchemy>=2.0,<3",
  "tenacity==9.1.4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
# Web chat (`make ui`). A default group so `make setup` and the test suite have it; the image of
# the agent and the mock syncs without default groups and never ships it.
ui = [
  "gradio>=6.27,<7",
]

[tool.uv]
default-groups = ["dev", "ui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config", "evals", "mock_api", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "config", "mock_api", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "config", "evals", "mock_api", "scripts", "tests"]
